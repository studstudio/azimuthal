<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover"
  >

  <meta name="theme-color" content="#d8c7a5">

  <title>Azimuthal Map</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #d8c7a5;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
                   Helvetica, Arial, sans-serif;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      background:
        radial-gradient(
          circle at 50% 48%,
          #e5d7b9 0%,
          #d8c7a5 55%,
          #c9b58c 100%
        );
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Ocean */

    .ocean {
      fill: #d7c6a3;
    }

    /* Land base */

    .land {
      fill: #cbb78d;
      stroke: #9f8b68;
      stroke-width: 0.45;
      vector-effect: non-scaling-stroke;
    }

    /* Slightly lighter terrain regions */

    .terrain-light {
      fill: #d8c69d;
      opacity: 0.72;
    }

    .terrain-mid {
      fill: #bba477;
      opacity: 0.42;
    }

    .terrain-dark {
      fill: #917c59;
      opacity: 0.27;
    }

    /* Lakes */

    .lake {
      fill: #8299a0;
      opacity: 0.88;
      stroke: #667f86;
      stroke-width: 0.45;
      vector-effect: non-scaling-stroke;
    }

    /* Rivers */

    .river {
      fill: none;
      stroke: #708b91;
      stroke-width: 0.7;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.82;
      vector-effect: non-scaling-stroke;
    }

    .river-major {
      stroke-width: 1.05;
      opacity: 0.9;
    }

    /* Coast */

    .coast {
      fill: none;
      stroke: #806e51;
      stroke-width: 0.65;
      vector-effect: non-scaling-stroke;
    }

    /* Graticule */

    .graticule {
      fill: none;
      stroke: #8f8065;
      stroke-width: 0.35;
      opacity: 0.22;
      vector-effect: non-scaling-stroke;
    }

    /* Outer edge of projection */

    .projection-boundary {
      fill: none;
      stroke: #8c7857;
      stroke-width: 1;
      opacity: 0.55;
      vector-effect: non-scaling-stroke;
    }

    /* Subtle map grain */

    .grain {
      pointer-events: none;
      opacity: 0.10;
      mix-blend-mode: multiply;
    }

    /* Top UI */

    #hud {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      left: 0;
      right: 0;
      padding: 14px 16px 0 16px;
      pointer-events: none;
    }

    #title {
      display: inline-block;
      padding: 8px 11px;
      border-radius: 9px;

      background: rgba(237, 225, 196, 0.72);
      border: 1px solid rgba(92, 76, 51, 0.18);

      color: #51442e;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* Bottom controls */

    #controls {
      position: fixed;
      right: 14px;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));

      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    button {
      width: 42px;
      height: 42px;

      border: 1px solid rgba(73, 59, 38, 0.25);
      border-radius: 11px;

      background: rgba(229, 214, 179, 0.82);
      color: #51442e;

      font-size: 20px;
      line-height: 1;

      box-shadow:
        0 2px 8px rgba(60, 45, 25, 0.12);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    button:active {
      transform: scale(0.94);
      background: rgba(207, 191, 153, 0.9);
    }

    #coordinates {
      position: fixed;
      left: 14px;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));

      padding: 7px 10px;

      border-radius: 8px;
      background: rgba(229, 214, 179, 0.72);
      border: 1px solid rgba(73, 59, 38, 0.18);

      color: #62523a;
      font-size: 10px;
      font-variant-numeric: tabular-nums;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
  </style>
</head>

<body>

<div id="map"></div>

<div id="hud">
  <div id="title">AZIMUTHAL EQUidISTANT</div>
</div>

<div id="coordinates">
  0.000° N &nbsp; 0.000° E
</div>

<div id="controls">
  <button id="zoomIn" aria-label="Zoom in">+</button>
  <button id="zoomOut" aria-label="Zoom out">−</button>
  <button id="reset" aria-label="Reset map">⌾</button>
</div>


<!-- D3 -->
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

<!-- World geographic data -->
<script src="https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.js"></script>


<script>

(() => {

  /*
   * ------------------------------------------------------------
   * MAP SETUP
   * ------------------------------------------------------------
   */

  const container = document.getElementById("map");

  const svg = d3.select(container)
    .append("svg")
    .attr("width", "100%")
    .attr("height", "100%")
    .attr("preserveAspectRatio", "xMidYMid meet");

  const defs = svg.append("defs");

  /*
   * Subtle paper / terrain texture.
   */

  const filter = defs.append("filter")
    .attr("id", "terrainNoise");

  filter.append("feTurbulence")
    .attr("type", "fractalNoise")
    .attr("baseFrequency", "0.018")
    .attr("numOctaves", 3)
    .attr("seed", 8)
    .attr("result", "noise");

  filter.append("feColorMatrix")
    .attr("type", "saturate")
    .attr("values", 0);

  filter.append("feComponentTransfer")
    .append("feFuncA")
    .attr("type", "table")
    .attr("tableValues", "0 0.17");

  /*
   * Map group.
   *
   * Everything inside this group is transformed together.
   */

  const mapGroup = svg.append("g")
    .attr("class", "map-group");


  /*
   * ------------------------------------------------------------
   * PROJECTION
   * ------------------------------------------------------------

   * Azimuthal Equidistant:
   *
   *   - distances from center are preserved
   *   - bearings from center are preserved
   *   - ideal for plotting tracks radiating from a central point
   */

    .rotate([0, 0])
    .center([0, 0])
    .translate([0, 0])
    .scale(100);

  const path = d3.geoPath(projection);

   * Current view transform.
   */
