<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Sync Map</title>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            margin: 0;
            background-color: #fcf8f2;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        #map-container {
            width: 100vw;
            height: 100vh;
            cursor: grab;
        }
        #map-container:active {
            cursor: grabbing;
        }
        .ocean {
            fill: #e8ded1;
        }
        .graticule {
            fill: none;
            stroke: #dfd0be;
            stroke-width: 0.5px;
            stroke-opacity: 0.6;
        }
        .land-mass {
            fill: #f5ece1;
            stroke: #dfd3c3;
            stroke-width: 0.5px;
        }
        .send-point {
            fill: #4AF626;
        }
        .pull-square {
            fill: #3ce01b;
        }
        .sync-line {
            fill: none;
            stroke: #4AF626;
            stroke-linecap: round;
            opacity: 0.9;
        }
        .self-sync-outline {
            fill: none;
            stroke: #4AF626;
            stroke-width: 1.5px;
        }
        .self-sync-center {
            fill: #4AF626;
        }
        #dashboard-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(252, 248, 242, 0.95);
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            border: 1px solid #dfd3c3;
            pointer-events: none;
            z-index: 100;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #5c4d3c;
        }
        .subtitle {
            font-size: 11px;
            color: #8c7b69;
            margin: 0;
        }
    </style>
</head>
<body>

    <div id="dashboard-ui">
        <h1>Global Latency Vector Map</h1>
        <p class="subtitle">Azimuthal Equidistant Projection • 1 Dash = 15 Mins</p>
    </div>

    <svg id="map-container"></svg>

    <script>
        const width = window.innerWidth;
        const height = window.innerHeight;

        const svg = d3.select("#map-container")
            .attr("width", width)
            .attr("height", height);

        const mainGroup = svg.append("g");

        // Center map projection near the center of the world view [Longitude, Latitude]
        const projection = d3.geoAzimuthalEquidistant()
            .scale(Math.min(width, height) * 0.35)
            .translate([width / 2, height / 2])
            .center([0, 20])
            .clipAngle(180 - 1e-3);

        const pathGenerator = d3.geoPath().projection(projection);

        // Add background ocean bounding sphere
        mainGroup.append("path")
            .datum({type: "Sphere"})
            .attr("class", "ocean")
            .attr("d", pathGenerator);

        // Add longitude and latitude gridline layers
        mainGroup.append("path")
            .datum(d3.geoGraticule().step([20, 20]))
            .attr("class", "graticule")
            .attr("d", pathGenerator);

        // Fetch official high-performance map geometries
        d3.json("https://jsdelivr.net").then(worldData => {
            
            mainGroup.append("g")
                .selectAll("path")
                .data(topojson.feature(worldData, worldData.objects.land).features)
                .enter().append("path")
                .attr("class", "land-mass")
                .attr("d", pathGenerator);

            // Simulation sync entries data pipeline array
            const activeSyncs = [
                { id: 1, type: "transit", from: [-87.6298, 41.8781], to: [-0.1276, 51.5074], mins: 120 }, 
                { id: 2, type: "transit", from: [139.6917, 35.6895], to: [121.5654, 25.0330], mins: 30 },  
                { id: 3, type: "transit", from: [12.4964, 41.9028], to: [37.6173, 55.7558], mins: 315 },  
                { id: 4, type: "self", coords: [-122.4194, 37.7749] }
            ];

            renderDataLayers(activeSyncs);
        }).catch(err => console.error("Error configuration parsing geographic data sets:", err));

        function renderDataLayers(data) {
            data.forEach(d => {
                if (d.type === "self") {
                    const screenPos = projection(d.coords);
                    if (!screenPos) return;

                    const markerGroup = mainGroup.append("g")
                        .attr("class", "self-sync-marker")
                        .datum(d)
                        .attr("transform", "translate(" + screenPos[0] + "," + screenPos[1] + ")");

                    markerGroup.append("rect")
                        .attr("class", "self-sync-outline")
                        .attr("width", 12)
                        .attr("height", 12)
                        .attr("x", -6)
                        .attr("y", -6);

                    markerGroup.append("circle")
                        .attr("class", "self-sync-center")
                        .attr("r", 3);

                } else {
                    const geoLine = {
                        type: "LineString",
                        coordinates: [d.from, d.to]
                    };

                    const path = mainGroup.append("path")
                        .datum(geoLine)
                        .attr("class", "sync-line")
                        .attr("d", pathGenerator);

                    if (path.node()) {
                        const totalLength = path.node().getTotalLength();
                        const segmentsCount = Math.max(1, Math.floor(d.mins / 15));
                        const chunk = totalLength / segmentsCount;
                        const dash = chunk * 0.70;
                        const gap = chunk * 0.30;
                        path.style("stroke-dasharray", dash + ", " + gap);
                    }

                    const sourcePos = projection(d.from);
                    if (sourcePos) {
                        mainGroup.append("circle")
                            .datum(d)
                            .attr("class", "send-point")
                            .attr("cx", sourcePos[0])
                            .attr("cy", sourcePos[1])
                            .attr("r", 5);
                    }

                    const destPos = projection(d.to);
                    if (destPos) {
                        mainGroup.append("rect")
                            .datum(d)
                            .attr("class", "pull-square")
                            .attr("x", destPos[0] - 5)
                            .attr("y", destPos[1] - 5)
                            .attr("width", 10)
                            .attr("height", 10);
                    }
                }
            });
        }

        // Handle panning and multi-touch zoom transformations
        const zoomBehavior = d3.zoom()
            .scaleExtent([1, 20])
            .on("zoom", (event) => {
                const transform = event.transform;
                mainGroup.attr("transform", transform);

                mainGroup.selectAll(".send-point")
                    .attr("r", 5 / transform.k)
                    .attr("cx", d => projection(d.from)[0])
                    .attr("cy", d => projection(d.from)[1]);

                mainGroup.selectAll(".pull-square")
                    .attr("width", 10 / transform.k)
                    .attr("height", 10 / transform.k)
                    .attr("x", d => projection(d.to)[0] - (5 / transform.k))
                    .attr("y", d => projection(d.to)[1] - (5 / transform.k));

                mainGroup.selectAll(".sync-line")
                    .style("stroke-width", 2 / transform.k);

                mainGroup.selectAll(".self-sync-marker")
                    .attr("transform", d => {
                        const pos = projection(d.coords);
                        return "translate(" + pos[0] + "," + pos[1] + ")";
                    });

                mainGroup.selectAll(".self-sync-outline")
                    .attr("width", 12 / transform.k)
                    .attr("height", 12 / transform.k)
                    .attr("x", -6 / transform.k)
                    .attr("y", -6 / transform.k)
                    .style("stroke-width", 1.5 / transform.k);

                mainGroup.selectAll(".self-sync-center")
                    .attr("r", 3 / transform.k);

                mainGroup.selectAll(".graticule")
                    .style("stroke-width", 0.5 / transform.k);

                mainGroup.selectAll(".land-mass")
                    .style("stroke-width", 0.5 / transform.k);
            });

        svg.call(zoomBehavior);
    </script>
</body>
</html>
