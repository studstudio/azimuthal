<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Sync Map</title>
    <style>
        body {
            margin: 0;
            background-color: #fcf8f2; /* Soft beige linen base */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #dashboard-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(252, 248, 242, 0.95);
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            border: 1px solid #dfd3c3;
            pointer-events: none;
            z-index: 10;
        }
        h1 { margin: 0 0 4px 0; font-size: 14px; text-transform: uppercase; color: #5c4d3c; letter-spacing: 1px;}
        .subtitle { font-size: 11px; color: #8c7b69; margin: 0; }
    </style>
</head>
<body>

    <div id="dashboard-ui">
        <h1>Global Latency Vector Map</h1>
        <p class="subtitle">Azimuthal Equidistant Projection • 1 Dash = 15 Mins</p>
    </div>

    <canvas id="mapCanvas"></canvas>

    <script>
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // Map state configuration parameters
        let zoomScale = 1.0;
        let offsetX = 0;
        let offsetY = 0;
        let isDragging = false;
        let startX, startY;

        // Custom local dataset matrices (Lat, Lon)
        const syncData = [
            { from: [41.8781, -87.6298], to: [51.5074, -0.1276], mins: 120, label: "Chicago -> London" }, 
            { from: [35.6762, 139.6503], to: [25.0330, 121.5654], mins: 45, label: "Tokyo -> Taipei" },
            { from: [41.9028, 12.4964], to: [55.7558, 37.6173], mins: 330, label: "Rome -> Moscow" },
            { isSelf: true, coords: [37.7749, -122.4194], label: "SF Router Self-Sync" }
        ];

        // 1. BUILT-IN AZIMUTHAL EQUIDISTANT MATH PROJECTION ENGINE
        // Transforms raw spherical coordinates straight into flat pixel vectors natively
        function project(lat, lon) {
            const rLat = lat * Math.PI / 180;
            const rLon = lon * Math.PI / 180;
            
            // Map configuration center alignment axes (0, 0)
            const cLat = 0;
            const cLon = 0;

            const cosC = Math.sin(cLat) * Math.sin(rLat) + Math.cos(cLat) * Math.cos(rLat) * Math.cos(rLon - cLon);
            const c = Math.acos(Math.max(-1, Math.min(1, cosC)));
            
            if (c === 0) return { x: 0, y: 0 };

            const k = c / Math.sin(c);
            const x = k * Math.cos(rLat) * Math.sin(rLon - cLon);
            const y = k * (Math.cos(cLat) * Math.sin(rLat) - Math.sin(cLat) * Math.cos(rLat) * Math.cos(rLon - cLon));

            const mapRadius = Math.min(width, height) * 0.28;
            return {
                x: (x * mapRadius * zoomScale) + (width / 2) + offsetX,
                y: (-y * mapRadius * zoomScale) + (height / 2) + offsetY
            };
        }

        // 2. RENDERING PIPELINE ENGINE
        function drawMap() {
            ctx.fillStyle = "#fcf8f2";
            ctx.fillRect(0, 0, width, height);

            const center = project(0, 0);
            const maxRadius = Math.min(width, height) * 0.85 * zoomScale;

            // Render oceanic baseline container
            ctx.beginPath();
            ctx.arc(center.x, center.y, maxRadius, 0, 2 * Math.PI);
            ctx.fillStyle = "#e8ded1";
            ctx.fill();
            ctx.strokeStyle = "#dfd3c3";
            ctx.lineWidth = 2;
            ctx.stroke();

            // Draw azimuthal concentric grid matrices
            ctx.strokeStyle = "rgba(223, 208, 190, 0.6)";
            ctx.lineWidth = 1;
            for (let r = maxRadius / 6; r <= maxRadius; r += maxRadius / 6) {
                ctx.beginPath();
                ctx.arc(center.x, center.y, r, 0, 2 * Math.PI);
                ctx.stroke();
            }

            // Draw layout rays extending outward from core center
            for (let a = 0; a < 360; a += 30) {
                const rad = a * Math.PI / 180;
                ctx.beginPath();
                ctx.moveTo(center.x, center.y);
                ctx.lineTo(center.x + Math.cos(rad) * maxRadius, center.y + Math.sin(rad) * maxRadius);
                ctx.stroke();
            }

            // 3. TELEMETRY RENDER OVERLAY LAYER
            syncData.forEach(d => {
                if (d.isSelf) {
                    const pos = project(d.coords[0], d.coords[1]);
                    
                    // Render "Self-Sync" structural layout emblem (Square outline + inner green dot)
                    ctx.strokeStyle = "#4AF626";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(pos.x - 7, pos.y - 7, 14, 14);

                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, 3, 0, 2 * Math.PI);
                    ctx.fillStyle = "#4AF626";
                    ctx.fill();
                } else {
                    const start = project(d.from[0], d.from[1]);
                    const end = project(d.to[0], d.to[1]);

                    // Render dynamic dash segmentation (1 segment / break link entry per 15 minutes)
                    ctx.beginPath();
                    ctx.moveTo(start.x, start.y);
                    ctx.lineTo(end.x, end.y);
                    
                    const dx = end.x - start.x;
                    const dy = end.y - start.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    const intervalsCount = Math.max(1, Math.floor(d.mins / 15));
                    const chunkUnit = distance / intervalsCount;
                    
                    ctx.strokeStyle = "#4AF626";
                    ctx.lineWidth = 2.5;
                    ctx.setLineDash([chunkUnit * 0.75, chunkUnit * 0.25]);
                    ctx.stroke();
                    ctx.setLineDash([]); // Flush trace array parameters immediately

                    // Render sender node point (Soft green circle)
                    ctx.beginPath();
                    ctx.arc(start.x, start.y, 5, 0, 2 * Math.PI);
                    ctx.fillStyle = "#4AF626";
                    ctx.fill();

                    // Render receiver pull target node (Solid green block)
                    ctx.fillStyle = "#3ce01b";
                    ctx.fillRect(end.x - 5, end.y - 5, 10, 10);
                }
            });
        }

        // 4. MOUSE & MULTI-TOUCH INTERACTIVE LISTENERS
        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - offsetX;
            startY = e.clientY - offsetY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            offsetX = e.clientX - startX;
            offsetY = e.clientY - startY;
            drawMap();
        });

        window.addEventListener('mouseup', () => isDragging = false);

        window.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.deltaY < 0) {
                zoomScale = Math.min(zoomScale * 1.1, 15.0);
            } else {
                zoomScale = Math.max(zoomScale / 1.1, 0.5);
            }
            drawMap();
        }, { passive: false });

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            drawMap();
        });

        // Bootstrap visual runtime loop execution configuration
        drawMap();
    </script>
</body>
</html>
